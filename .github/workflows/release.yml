name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/fps-swap \
            target/aarch64-apple-darwin/release/fps-swap \
            target/x86_64-apple-darwin/release/fps-swap
          lipo -info dist/fps-swap
      - name: Package
        run: |
          pkg="fps-swap-${GITHUB_REF_NAME}-macos-universal"
          mkdir -p "dist/$pkg"
          cp dist/fps-swap install.sh uninstall.sh README.md LICENSE "dist/$pkg/"
          cp -R quickaction "dist/$pkg/"
          chmod 755 "dist/$pkg/fps-swap" "dist/$pkg/install.sh" "dist/$pkg/uninstall.sh"
          (cd dist && ditto -c -k --norsrc --noextattr --keepParent "$pkg" "$pkg.zip")
          echo "ZIP=dist/$pkg.zip" >> "$GITHUB_ENV"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
